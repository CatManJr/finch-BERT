[project]
name = "finch-bert"
version = "0.1.0"
description = "CPU extractive QA with unstructured-sparse oBERT and Finch SpMM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "finch-tensor>=0.6.0",
    "numpy>=2.0",
    "transformers>=5.15.0",
]

[dependency-groups]
dev = [
    "codespell>=2.4.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["finchbert"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
markers = [
    "slow: downloads checkpoints or runs full-model checks",
]

[tool.codespell]
skip = ".git,.venv,uv.lock,.mypy_cache,.ruff_cache,.pytest_cache"
